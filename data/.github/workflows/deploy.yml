# Compila, prueba y publica la Espectroteca IR en GitHub Pages en cada push a main.
# Requisito único: en el repositorio, Settings → Pages → Source = «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar que no hay claves privadas
        run: npm run check:secrets
      - name: Validar la biblioteca publicada
        run: npm run library:validate
      - name: Pruebas (conversor JCAMP-DX, detección, asignación, biblioteca)
        run: npm test
      - name: Pruebas con archivos JCAMP-DX reales (descargados de PyPI, no versionados)
        run: npm run test:real
        continue-on-error: true
      - name: Compilar con la ruta del repositorio
        run: npm run build
        env:
          # https://USUARIO.github.io/NOMBRE-DEL-REPOSITORIO/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
